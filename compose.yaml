services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: materials
      POSTGRES_USER: materials
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./materials_pipeline/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U materials -d materials"]
      interval: 5s
      timeout: 3s
      retries: 20
  agent-a:
    build: .
    command: ["queue-worker", "--agent-id", "agent-a", "--root", "/data/corpus"]
    environment:
      DATABASE_URL: postgresql://materials:${POSTGRES_PASSWORD}@db:5432/materials
      MATERIALS_RATE_LIMIT_ROOT: /data/network
    volumes:
      - corpus:/data
    depends_on:
      db:
        condition: service_healthy
  agent-b:
    build: .
    command: ["queue-worker", "--agent-id", "agent-b", "--root", "/data/corpus"]
    environment:
      DATABASE_URL: postgresql://materials:${POSTGRES_PASSWORD}@db:5432/materials
      MATERIALS_RATE_LIMIT_ROOT: /data/network
    volumes:
      - corpus:/data
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
  corpus:
